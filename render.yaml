services:
  - type: web
    name: agri-voice-agent-farmer
    env: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: python -m agri_voice_agent.farmer_server
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: DEFAULT_LOCATION
        value: Colombo,LK
