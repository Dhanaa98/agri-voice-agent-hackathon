<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Domine:wght@700&family=Nunito+Sans:wght@400;700&display=swap">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #17301F; color: #F2F5EE;
    font-family: 'Nunito Sans', Arial, sans-serif;
    position: relative;
  }
  .field {
    position: absolute; inset: auto 0 0 0; height: 300px;
    background: repeating-linear-gradient(100deg, #1E3B27 0 70px, #17301F 70px 140px);
    opacity: 0.9;
  }
  .content { position: absolute; left: 140px; top: 150px; width: 1000px; }
  .eyebrow { font-size: 26px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; color: #D9A441; }
  h1 { font-family: 'Domine', Georgia, serif; font-size: 168px; line-height: 1; margin: 36px 0 32px; }
  .sub { font-size: 46px; line-height: 1.3; color: #F2F5EE; margin: 0; }
  .pills { display: flex; gap: 18px; margin-top: 56px; }
  .pill { font-size: 28px; font-weight: 700; padding: 14px 28px; border-radius: 999px; background: #22402C; color: #F2F5EE; border: 2px solid #2F6B45; }
  .art { position: absolute; right: 150px; top: 170px; width: 560px; height: 560px; border-radius: 50%; object-fit: cover; }
</style>
</head>
<body>
  <div class="field"></div>
  <div class="content">
    <div class="eyebrow">AssemblyAI Voice Agent Hackathon</div>
    <h1>Hey Green</h1>
    <p class="sub">A voice farm assistant for weather, crops and plant health.</p>
    <div class="pills">
      <span class="pill">Weather</span>
      <span class="pill">Crops</span>
      <span class="pill">Plant health</span>
    </div>
  </div>
  <img class="art" src="cover-logo.png" alt="HeyGreen logo: a leaf between two audio-waveform bars">
</body>
</html>
