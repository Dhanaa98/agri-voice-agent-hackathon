services:
  - type: web
    name: hey-green
    env: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: python -m agri_voice_agent.farmer_server
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: DEFAULT_LOCATION
        value: Colombo,LK
      # elevenlabs-tts branch only -- cloud TTS for spoken replies. Both
      # optional: without them the app falls back to the browser's free
      # speechSynthesis exactly as it does on master. See .env.example.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
